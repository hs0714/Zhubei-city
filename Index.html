<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏙️ 3D 竹北未來城 - 兒童大亨版</title>
    <!-- 載入 Three.js 3D 引擎與五彩紙屑特效 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Microsoft JhengHei', sans-serif; user-select: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #87CEEB; }
        
        /* 3D 畫布容器 */
        #webgl-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* UI 儀表板 (浮動於 3D 畫面上方) */
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        
        .dashboard { pointer-events: auto; background: rgba(255, 255, 255, 0.9); padding: 12px 20px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); display: flex; justify-content: space-around; align-items: center; border: 3px solid #FFCA28; }
        .stat-item { font-size: 18px; font-weight: bold; color: #333; }

        /* 建築選單區塊 */
        .controls { pointer-events: auto; background: rgba(255, 255, 255, 0.85); padding: 12px; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); max-height: 40vh; overflow-y: auto; }
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
        
        .card { background: #FFF9C4; border: 3px solid #FBC02D; border-radius: 12px; padding: 8px; cursor: pointer; text-align: center; }
        .card:active { transform: scale(0.95); background: #FFF59D; }
        .card-icon { font-size: 24px; }
        .card-title { font-weight: bold; font-size: 13px; color: #333; margin: 2px 0; }
        .card-cost { color: #E65100; font-weight: bold; font-size: 12px; }

        .action-btn { width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #2E7D32; }
        .action-btn:active { box-shadow: 0 0 #2E7D32; transform: translateY(4px); }
        
        .tip-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: white; padding: 6px 16px; border-radius: 20px; font-size: 14px; pointer-events: none; }
    </style>
</head>
<body>

<div id="webgl-container"></div>

<div class="ui-layer">
    <div class="dashboard">
        <div class="stat-item">💰 <span id="money">1000</span></div>
        <div class="stat-item">👥 <span id="pop">100</span>人</div>
        <div class="stat-item">😊 <span id="happy">80</span>%</div>
        <div class="stat-item">🏫 <span id="school">0</span>間</div>
    </div>

    <div class="tip-box">👆 用單指可以旋轉 3D 竹北地圖喔！</div>

    <div class="controls">
        <div class="btn-grid">
            <div class="card" onclick="build('school')">
                <div class="card-icon">🏫</div>
                <div class="card-title">竹北學校</div>
                <div class="card-cost">💰 200</div>
            </div>
            <div class="card" onclick="build('park')">
                <div class="card-icon">🎡</div>
                <div class="card-title">兒童樂園</div>
                <div class="card-cost">💰 100</div>
            </div>
            <div class="card" onclick="build('sports')">
                <div class="card-icon">🎾</div>
                <div class="card-title">皮克球場</div>
                <div class="card-cost">💰 150</div>
            </div>
            <div class="card" onclick="build('mall')">
                <div class="card-icon">🛍️</div>
                <div class="card-title">竹北遠百</div>
                <div class="card-cost">💰 300</div>
            </div>
            <div class="card" onclick="build('walkway')">
                <div class="card-icon">🚶</div>
                <div class="card-title">通學步道</div>
                <div class="card-cost">💰 80</div>
            </div>
            <div class="card" onclick="build('house')">
                <div class="card-icon">🏠</div>
                <div class="card-title">住宅區</div>
                <div class="card-cost">💰 120</div>
            </div>
        </div>
        <button class="action-btn" onclick="nextDay()">☀️ 過了一天（領取稅金）</button>
    </div>
</div>

<script>
    // --- 數據狀態 ---
    let money = 1000, pop = 100, happy = 80, school = 0;
    const items = {
        school: { name: '竹北學校', cost: 200, happy: 10, pop: 20, isSchool: true, color: 0x42A5F5, height: 2 },
        park: { name: '兒童樂園', cost: 100, happy: 15, pop: 10, color: 0xFFCA28, height: 1.2 },
        sports: { name: '皮克球場', cost: 150, happy: 12, pop: 5, color: 0x66BB6A, height: 0.5 },
        mall: { name: '竹北遠百', cost: 300, happy: 5, pop: 50, color: 0xAB47BC, height: 3.5 },
        walkway: { name: '通學步道', cost: 80, happy: 8, pop: 5, color: 0x8D6E63, height: 0.2 },
        house: { name: '住宅區', cost: 120, happy: -2, pop: 40, color: 0xFF7043, height: 1.5 }
    };

    // --- Three.js 3D 場景建置 ---
    const container = document.getElementById('webgl-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // 天空藍

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 25, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // 視角旋轉控制 (OrbitControls)
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2.1; // 不讓視角鑽到地下

    // 光線設定
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 建立 3D 綠色地基島嶼 (竹北城底盤)
    const islandGeometry = new THREE.CylinderGeometry(15, 16, 2, 32);
    const islandMaterial = new THREE.MeshLambertMaterial({ color: 0x81C784 });
    const island = new THREE.Mesh(islandGeometry, islandMaterial);
    island.position.y = -1;
    island.receiveShadow = true;
    scene.add(island);

    // 隨機在地上種幾棵裝飾小樹
    for(let i=0; i<12; i++) {
        createTree((Math.random()-0.5)*24, (Math.random()-0.5)*24);
    }

    function createTree(x, z) {
        if(Math.sqrt(x*x + z*z) > 13) return; // 避免超出島嶼
        const trunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 1);
        const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5D4037 });
        const trunk = new THREE.Mesh(trunkGeo, trunkMat);
        
        const leavesGeo = new THREE.ConeGeometry(1, 2, 8);
        const leavesMat = new THREE.MeshLambertMaterial({ color: 0x2E7D32 });
        const leaves = new THREE.Mesh(leavesGeo, leavesMat);
        leaves.position.y = 1.2;

        const tree = new THREE.Group();
        tree.add(trunk);
        tree.add(leaves);
        tree.position.set(x, 0.5, z);
        scene.add(tree);
    }

    // --- 建築建造與 3D 動畫 ---
    function build(type) {
        let item = items[type];
        if (money < item.cost) {
            alert('💰 金幣不夠喔！按下方的「過了一天」來賺錢吧！');
            return;
        }

        money -= item.cost;
        happy = Math.min(100, happy + item.happy);
        pop += item.pop;
        if(item.isSchool) school += 1;

        // 產生 3D 立體建築方塊
        spawn3DBuilding(item);

        updateUI();
        checkWin();
    }

    function spawn3DBuilding(item) {
        const geo = new THREE.BoxGeometry(2, item.height, 2);
        const mat = new THREE.MeshLambertMaterial({ color: item.color });
        const building = new THREE.Mesh(geo, mat);
        building.castShadow = true;
        building.receiveShadow = true;

        // 在島嶼範圍內找個空地生成
        let x = (Math.random() - 0.5) * 20;
        let z = (Math.random() - 0.5) * 20;
        
        // 降落動畫起始位置
        building.position.set(x, 15, z);
        scene.add(building);

        // 簡單的動態降落效果
        let targetY = item.height / 2;
        function dropAnimation() {
            if (building.position.y > targetY) {
                building.position.y -= 0.8;
                requestAnimationFrame(dropAnimation);
            } else {
                building.position.y = targetY;
            }
        }
        dropAnimation();
    }

    function updateUI() {
        document.getElementById('money').innerText = money;
        document.getElementById('pop').innerText = pop;
        document.getElementById('happy').innerText = happy;
        document.getElementById('school').innerText = school;
    }

    function nextDay() {
        let income = 100 + (pop * 2);
        money += income;
        updateUI();
    }

    function checkWin() {
        if (pop >= 400 && happy >= 90 && school >= 2) {
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            setTimeout(() => {
                alert('🏆 太棒了！你成功蓋出了超級亮眼的 3D《竹北未來城》！');
            }, 500);
        }
    }

    // 視角自適應與渲染迴圈
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }
    animate();
</script>
</body>
</html>
